<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEYORA — Fashion & Winter Store</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>VEYORA</b><div><button id="search">⌕</button><button id="cart">🛒 <span id="count">0</span></button></div></header>

<main id="shop"><div class="head"><div><p>CURATED FOR YOU</p><h2>Shop products</h2></div><select id="sort"><option value="f">Featured</option><option value="l">Price low-high</option><option value="h">Price high-low</option></select></div><div id="grid"></div></main>
