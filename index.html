<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEYORA Admin Dashboard</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">VEYORA</div><h1>Admin Panel</h1><p>Manage products and orders</p><form id="loginForm"><input id="user" required placeholder="Username"><input id="pass" required type="password" placeholder="Password"><button>LOGIN</button></form><small>Demo login: admin / veyora123</small></div></div>
<div id="app" hidden>
<header><div class="brand">VEYORA <span>ADMIN</span></div><button id="logout">Logout</button></header>
<nav><button data-page="dashboard" class="active">Dashboard</button><button data-page="products">Products</button><button data-page="orders">Orders</button></nav>
<main>
<section id="dashboard" class="page"><div class="top"><div><small>OVERVIEW</small><h1>Dashboard</h1></div><button class="primary" data-page="products">+ Add Product</button></div>
<div class="stats"><div><small>PRODUCTS</small><strong id="statProducts">0</strong></div><div><small>ORDERS</small><strong id="statOrders">0</strong></div><div><small>REVENUE</small><strong id="statRevenue">Rs 0</strong></div><div><small>PENDING</small><strong id="statPending">0</strong></div></div>
<div class="panel"><h2>Recent orders</h2><div id="recent"></div></div></section>
<section id="products" class="page" hidden><div class="top"><div><small>CATALOG</small><h1>Products</h1></div><button class="primary" id="addBtn">+ Add Product</button></div><div class="panel"><div id="productList"></div></div></section>
<section id="orders" class="page" hidden><div class="top"><div><small>SALES</small><h1>Orders</h1></div></div><div class="panel"><div id="orderList"></div></div></section>
</main></div>
<div id="modal" class="modal"><div class="modalbox"><button id="close" class="x">×</button><h2 id="modalTitle">Add Product</h2>
<form id="productForm"><input type="hidden" id="pid"><label>Product name<input id="pname" required></label><div class="two"><label>Price (PKR)<input id="price" type="number" min="0" required></label><label>Stock<input id="stock" type="number" min="0" required></label></div>
<div class="two"><label>Category<select id="category"><option>Men</option><option>Women</option><option>Winter</option><option>Accessories</option><option>New</option></select></label><label>Sizes<input id="sizes" placeholder="S, M, L, XL"></label></div>
<label>Colors<input id="colors" placeholder="Black, Brown"></label><label>Image URL<input id="image" placeholder="https://..."></label><label>Description<textarea id="desc" rows="4"></textarea></label><button class="primary">Save Product</button></form></div></div>
<script src="admin.js"></script></body></html>
